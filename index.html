<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom for You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Allura&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="particles"></div>

<section id="landing">

    <div class="flower-wrapper">

        <!-- Watercolor Black Water Lily -->
        <svg id="flower" viewBox="0 0 500 500">

            <defs>

                <radialGradient id="petal"
                    cx="50%" cy="50%">
                    <stop offset="0%" stop-color="#555"/>
                    <stop offset="60%" stop-color="#222"/>
                    <stop offset="100%" stop-color="#000"/>
                </radialGradient>

                <filter id="blur">
                    <feGaussianBlur stdDeviation="2"/>
                </filter>

            </defs>

            <g opacity=".85">

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(0 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(30 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(60 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(90 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(120 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(150 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(180 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(210 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(240 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(270 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(300 250 250)"
                filter="url(#blur)"/>

                <ellipse
                cx="250"
                cy="140"
                rx="45"
                ry="120"
                fill="url(#petal)"
                transform="rotate(330 250 250)"
                filter="url(#blur)"/>

            </g>

            <circle
            cx="250"
            cy="250"
            r="42"
            fill="#111"/>

        </svg>

    </div>

    <p class="tap-text">
        Tap the flower.
    </p>

</section>

<section id="cardSection">

    <div class="postcard">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="card-text">

            <p>If birthdays were places,</p>

            <p>I'd build you a garden.</p>

            <br>

            <p>Until then...</p>

            <br>

            <p>I made you this little bloom.</p>

            <br>

            <h2>Happy Birthday.</h2>

        </div>

        <a
        class="enter"
        href="https://t.me/+-zOhxH71CXgyMjdk"
        target="_blank">
            Enter Bloom for You
        </a>

    </div>

</section>

<footer>

    Made with love, just for you.

</footer>

<audio id="music">

    <!--
    Happy Birthday piano mp3
    Replace with your own file:
    music/happy-birthday-piano.mp3
    -->

    <source
    src="music/happy-birthday-piano.mp3"
    type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>
</html>
